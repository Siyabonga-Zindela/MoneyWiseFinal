[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .

# The real URL is injected by migrations/env.py from the DATABASE_URL env var
# (or backend/.env). Never commit real credentials here.
sqlalchemy.url = postgresql://user:password@localhost:5432/dbname

file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
